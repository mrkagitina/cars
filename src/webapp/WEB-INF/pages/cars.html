<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cars</title>
</head>
<body>
    <div>
        <table border="2">
        <tr> <th>Year</th>
            <th>Model</th>
            <th>Color</th>
        </tr>
        <tr th:each="car : ${cars}">
        <td th:text="${car.year}">...</td>
        <td th:utext="${car.model}">...</td>
            <td th:utext="${car.color}">...</td>
            </tr>
        </table>
    </div>
</body>
</html>
